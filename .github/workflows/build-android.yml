name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          if [ -f sitepadi-source.zip ]; then
            unzip -o sitepadi-source.zip -d .
          fi

      - name: Place google-services.json
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json placed in android/app/"
          else
            echo "No google-services.json at repo root — skipping (Google Sign-In config step not done yet, that's fine)"
          fi

      - name: Apply Google Sign-In Web Client ID
        run: |
          sed -i "s/REPLACE_ME.apps.googleusercontent.com/211099277111-d7nrolgkmi1nde88fon5cs01f39r40sq.apps.googleusercontent.com/g" capacitor.config.ts
          sed -i "s/REPLACE_ME.apps.googleusercontent.com/211099277111-d7nrolgkmi1nde88fon5cs01f39r40sq.apps.googleusercontent.com/g" android/app/src/main/res/values/strings.xml
          echo "Web Client ID applied to both files"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: |
          npm install
          npm install --no-save typescript

      - name: Sync Capacitor (copies www/ into android/)
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sitepadi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
